name = "itmecasey-tip-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Shown on the tip page. Change them in the Cloudflare dashboard (Settings > Variables) any time.
STREAMER_NAME = "your streamer name"
CURRENCY = "USD"
# "true" sends and checks tips through PayPal's sandbox (testing only).
SANDBOX = "false"

# The app sets these when it deploys: RELAY_TOKEN, and PAYPAL_EMAIL or KOFI_PAGE + KOFI_TOKEN, whichever service the streamer uses.

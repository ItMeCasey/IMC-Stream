<!doctype html>
<html><head><meta charset="utf-8"><title>IMC-Stream Dance Party</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* OBS Browser Source: http://localhost:8420/overlays/dance.html?scale=1   (1920 x 1080, transparent, full screen)
     A dance party to the current song. The lights, lasers, strobes (3 flashes a second at most), dancers, DJ and pyrotechnics all run on one beat grid
     found in the music (beat.js): they hit every beat, change on the bar, tense up in a build-up and explode on the drop.
     The audio comes from the app's music feed (the same one as the Now Playing bars). ?demo=1 runs a test party, &secs=30 makes it shorter.
     ?lead=40 fires every beat 40 ms early (to make up for delays between the music and what you see). */
  html, body { background: transparent; overflow: hidden; } canvas { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; }
</style></head>
<body><canvas id="cv" width="1920" height="1080"></canvas>
<script src="config.js"></script>
<script src="beat.js"></script>
<script>
(function () {
  const C = window.CFG || {}, Q = new URLSearchParams(location.search), BASE = icmBase('dance', +(Q.get('port') || C.serverPort || 8420)), LEAD = +Q.get('lead') || 20;
  const cv = document.getElementById('cv'), g = cv.getContext('2d'), W = 1920, H = 1080; let U = 8;
  const PAL = ['#4FBBBC', '#F39120', '#EC4624', '#E2DAC2', '#B13A22'];
  const rng = (seed) => { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };
  const hash = (str) => { let h = 2166136261; for (const c of String(str)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  let P = null;                                   // the running party: { until, start, dancers, by, strobe, ... }
  const eng = BeatEngine({ lead: LEAD });
  let V = eng.view(Date.now()), rawAt = 0, lastFlash = 0, flashA = 0, flashUntil = 0, dropAt = 0, laterQ = [];
  const later = (ms, fn) => laterQ.push({ at: performance.now() + ms, fn });

  // text in the same style as the other overlays: Bahnschrift bold, condensed (like font-stretch 85%), UPPERCASE, letter-spaced
  function txt(str, x, y, size, fill, stroke, sw, spacing) {
    g.font = '700 ' + size + 'px Bahnschrift, "Segoe UI", "Arial Narrow", sans-serif'; g.fontStretch = 'semi-condensed'; g.letterSpacing = (spacing || 2) + 'px'; g.textAlign = 'center'; const t = String(str).toUpperCase();
    if (stroke) { g.lineWidth = sw || 6; g.strokeStyle = stroke; g.lineJoin = 'round'; g.strokeText(t, x, y); } g.fillStyle = fill; g.fillText(t, x, y);
  }

  // ------------------------------------------------------------------ pixel dancers (same look as the duel people, drawn from rectangles)
  const SKINS = ['#f1c9a0', '#d9a074', '#a8734a', '#7a4a2c'], HAIR = ['#2b1d14', '#6b3f1d', '#d9b45a', '#c9442b', '#3b3b3b', '#e8e0d0'], SHIRTS = ['#4FBBBC', '#F39120', '#EC4624', '#E2DAC2', '#8e7cc3', '#6aa84f'];
  const look = (name) => { const r = rng(hash(name)); return { skin: SKINS[Math.floor(r() * 4)], hair: HAIR[Math.floor(r() * 6)], long: r() < 0.4, shirt: SHIRTS[Math.floor(r() * 6)], pants: '#2a3333', boots: '#14191a' }; };
  const MOVES = ['disco', 'wave', 'hop', 'sway', 'robot', 'jump'];
  function R(x, y, w, h, c, ox, oy) { g.fillStyle = c; g.fillRect(Math.round(ox + x * U), Math.round(oy + y * U), w * U, h * U); }
  /** move: which dance; step: beat count (alternates poses); ph: 0..1 through the current beat */
  function dancer(p, move, step, ph, ox, oy, amp) {
    const odd = step % 2 === 1, bounce = Math.min(1, Math.abs(Math.sin(ph * Math.PI)) * (amp || 1)); let dy = 0, armL = 'down', armR = 'down', spread = 0, lean = 0;
    if (move === 'disco') { armR = odd ? 'up' : 'down'; armL = 'hip'; dy = -bounce * 1; lean = odd ? 1 : -1; spread = odd ? 1 : 0; }
    else if (move === 'wave') { armL = odd ? 'up' : 'down'; armR = odd ? 'down' : 'up'; dy = -bounce * 1.5; }
    else if (move === 'hop') { armL = armR = 'out'; dy = -bounce * 4; spread = bounce > 0.5 ? 1 : 0; }
    else if (move === 'sway') { armL = odd ? 'up' : 'out'; armR = odd ? 'out' : 'up'; lean = odd ? -1 : 1; dy = -bounce * 0.5; }
    else if (move === 'robot') { armL = 'bent'; armR = 'bentUp'; if (odd) { armL = 'bentUp'; armR = 'bent'; } dy = 0; }
    else { armL = armR = 'up'; dy = -bounce * 6; spread = 1; }   // jump: both arms up
    const y0 = oy + dy * U, x0 = ox + lean * U * 0.5;

    R(4, 7, 8, 8, p.shirt, x0, y0); R(4, 13, 8, 2, 'rgba(0,0,0,.25)', x0, y0);                                                                                                  // body
    const arm = (side, kind) => { const x = side === 'L' ? 2 : 12, s = p.skin;
      if (kind === 'up') { R(x, 1, 2, 7, p.shirt, x0, y0); R(x, 0, 2, 2, s, x0, y0); }
      else if (kind === 'out') { R(side === 'L' ? 0 : 12, 8, 4, 2, p.shirt, x0, y0); R(side === 'L' ? -1 : 16, 8, 2, 2, s, x0, y0); }
      else if (kind === 'hip') { R(side === 'L' ? 1 : 13, 9, 2, 4, p.shirt, x0, y0); R(side === 'L' ? 2 : 12, 12, 2, 2, s, x0, y0); }
      else if (kind === 'bent') { R(x, 8, 2, 3, p.shirt, x0, y0); R(side === 'L' ? 0 : 12, 10, 4, 2, p.shirt, x0, y0); }
      else if (kind === 'bentUp') { R(x, 8, 2, 2, p.shirt, x0, y0); R(side === 'L' ? 0 : 14, 2, 2, 8, p.shirt, x0, y0); R(side === 'L' ? 0 : 14, 1, 2, 2, s, x0, y0); }
      else { R(x, 8, 2, 6, p.shirt, x0, y0); R(x, 13, 2, 2, s, x0, y0); } };
    arm('L', armL); arm('R', armR);
    R(5, 0, 6, 7, p.skin, x0, y0); R(5, 0, 6, 2, p.hair, x0, y0); R(4, 1, 2, p.long ? 7 : 3, p.hair, x0, y0); R(9, 3, 1, 2, '#14191a', x0, y0); R(7, 5, 3, 1, odd ? '#14191a' : p.skin, x0, y0);   // head, eye, smile

  }

  // ------------------------------------------------------------------ pyrotechnics: spark fountains, flame jets and firework shells (additive light)
  const sparks = [], flames = [], shells = [];
  const SP_COLS = ['#ffd9a0', '#F39120', '#ffffff', '#EC4624'];
  function fountain(x, y, power, n) {
    for (let k = 0; k < (n || 70); k++) { const ang = -Math.PI / 2 + (Math.random() - 0.5) * 0.6, sp = (650 + Math.random() * 520) * (power || 1); sparks.push({ x, y, px: x, py: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, g: 1500, age: 0, life: 0.9 + Math.random() * 0.9, col: SP_COLS[Math.floor(Math.random() * 4)], w: 2 + Math.random() * 3 }); }
  }
  function flameJet(x, y, h, dur) { flames.push({ x, y, h: h || 460, dur: dur || 1.2, age: 0, w: 56 + Math.random() * 26, seed: Math.random() * 100 }); }
  function shell(x, target, col) { shells.push({ x, y: H + 20, vy: -1100, target, col: col || PAL[Math.floor(Math.random() * 3)], dead: false }); }

  function pyroFx(dt, a) {

    for (let i = shells.length - 1; i >= 0; i--) if (shells[i].dead) shells.splice(i, 1);
    g.lineCap = 'round';
    for (const p of sparks) { p.age += dt; p.px = p.x; p.py = p.y; p.vy += p.g * dt; p.vx *= 1 - 0.6 * dt; p.x += p.vx * dt; p.y += p.vy * dt; const k = 1 - p.age / p.life; if (k <= 0) continue; g.globalAlpha = a * k; g.strokeStyle = p.col; g.lineWidth = p.w * (0.5 + k); g.beginPath(); g.moveTo(p.px, p.py); g.lineTo(p.x, p.y); g.stroke(); }
    for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].age >= sparks[i].life || sparks[i].y > H + 60) sparks.splice(i, 1);
    for (const f of flames) {
      f.age += dt; const k = f.age / f.dur; if (k >= 1) continue; const rise = k < 0.25 ? k / 0.25 : 1, fade = k < 0.7 ? 1 : (1 - k) / 0.3, hh = f.h * (1 - Math.pow(1 - rise, 3));
      for (let j = 0; j < 14; j++) { const t = j / 13, y = f.y - t * hh, wob = Math.sin(f.seed + now0 / 90 + j * 1.7) * 16 * t, r = f.w * (1 - t * 0.55) * (0.8 + 0.25 * Math.sin(f.seed + now0 / 60 + j));
        const gr = g.createRadialGradient(f.x + wob, y, 0, f.x + wob, y, r); gr.addColorStop(0, t < 0.35 ? 'rgba(255,245,210,.95)' : 'rgba(255,190,80,.85)'); gr.addColorStop(0.5, 'rgba(236,70,36,.55)'); gr.addColorStop(1, 'rgba(120,20,10,0)'); g.globalAlpha = a * fade * (1 - t * 0.35); g.fillStyle = gr; g.fillRect(f.x + wob - r, y - r, r * 2, r * 2); }
      if (Math.random() < 0.6) sparks.push({ x: f.x + (Math.random() - 0.5) * f.w, y: f.y - hh * Math.random(), px: 0, py: 0, vx: (Math.random() - 0.5) * 120, vy: -120 - Math.random() * 160, g: 0, age: 0, life: 0.7, col: '#ffb060', w: 2 });
    }
    for (let i = flames.length - 1; i >= 0; i--) if (flames[i].age >= flames[i].dur) flames.splice(i, 1);
    g.restore();
  }
  let now0 = 0;
  const FLOOR_Y = H - 60, DJ_Y = H - 410;
  const pyro = {
    stage(power) { fountain(W / 2 - 370, DJ_Y, power); fountain(W / 2 + 370, DJ_Y, power); },
    floor(power) { for (const x of [W * 0.2, W * 0.4, W * 0.6, W * 0.8]) fountain(x, FLOOR_Y, power, 55); },
    jets(all) { flameJet(110, FLOOR_Y, 520); flameJet(W - 110, FLOOR_Y, 520); if (all) { flameJet(W * 0.3, FLOOR_Y, 420, 1.3); flameJet(W * 0.7, FLOOR_Y, 420, 1.3); } },
    salvo(n) { for (let k = 0; k < n; k++) later(k * 180, () => shell(W * (0.12 + Math.random() * 0.76), H * (0.14 + Math.random() * 0.28))); },
  };

  // ------------------------------------------------------------------ the finale: steam blows in from both sides until it fills the screen, then everything fades
  const puff = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
    for (const [ox, oy, r, al] of [[128, 128, 120, 0.55], [92, 110, 80, 0.4], [168, 150, 84, 0.4], [120, 168, 70, 0.35], [150, 92, 66, 0.35]]) { const gr = x.createRadialGradient(ox, oy, 0, ox, oy, r); gr.addColorStop(0, 'rgba(236,241,241,' + al + ')'); gr.addColorStop(0.6, 'rgba(226,232,232,' + al * 0.45 + ')'); gr.addColorStop(1, 'rgba(226,232,232,0)'); x.fillStyle = gr; x.fillRect(0, 0, 256, 256); }
    return c; })();
  let steam = [], lastSteamT = 0;
  const STEAM_FROM = 11500;   // ms before the end when the steam starts
  function steamFx(now, left, a) {
    const dt = Math.min(0.1, (now - (lastSteamT || now)) / 1000); lastSteamT = now;
    if (left < STEAM_FROM && left > 2600) {   // spawn from the left and right edges, faster as the end gets closer
      const rate = 7 + (1 - (left - 2600) / (STEAM_FROM - 2600)) * 22;
      for (const side of [-1, 1]) { let n = rate * dt + Math.random(); n = Math.floor(n); for (let k = 0; k < n; k++) {
        const r1 = 360 + Math.random() * 260; steam.push({ x: side < 0 ? -140 : W + 140, y: H * (0.08 + Math.random() * 0.9), vx: -side * (110 + Math.random() * 170), vy: (Math.random() - 0.5) * 60, r0: 110 + Math.random() * 80, r1, age: 0, life: 5.5 + Math.random() * 3, rot: Math.random() * 6.28, al: 0.2 + Math.random() * 0.16 }); } }
    }
    const haze = Math.max(0, Math.min(1, (7500 - left) / 5000)) * 0.38;   // guarantees the screen ends up full
    for (const p of steam) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 0.18 * dt; }
    steam = steam.filter((p) => p.age < p.life);
    g.save(); for (const p of steam) { const k = p.age / p.life, r = p.r0 + (p.r1 - p.r0) * Math.min(1, k * 1.3), env = Math.min(1, p.age / 0.9) * Math.min(1, (p.life - p.age) / 1.5); g.globalAlpha = a * p.al * env; g.save(); g.translate(p.x, p.y); g.rotate(p.rot + p.age * 0.1); g.drawImage(puff, -r, -r, r * 2, r * 2); g.restore(); }
    if (haze > 0) { g.globalAlpha = a * haze; g.fillStyle = 'rgb(226,232,232)'; g.fillRect(0, 0, W, H); } g.restore();
  }

  // ------------------------------------------------------------------ the DJ: whoever paid for the party stands on a platform at the back, behind the decks
  function dj(a) {
    const name = P.by || 'DJ', p = P.djLook, x = W / 2, step = V.beatN, odd = step % 2 === 1, st = V.state, up = st === 'build' && V.buildP > 0.3, pump = V.sinceDrop < 6 || (V.bar === 0 && V.pulse > 0.5);
    const u = 8, feet = DJ_Y, ox = x - 8 * u, oy = feet - 24 * u + 14, col = PAL[Math.floor(V.beatN / 4) % 3], bob = V.pulse * 0.9 * (st === 'break' ? 0.4 : 1);
    g.save(); g.globalAlpha = a;
    const sg = g.createLinearGradient(x, 0, x, feet); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(1, 'rgba(255,255,255,' + (0.1 + V.pulse * 0.16) + ')'); g.fillStyle = sg; g.beginPath(); g.moveTo(x - 10, 0); g.lineTo(x + 10, 0); g.lineTo(x + 330, feet + 10); g.lineTo(x - 330, feet + 10); g.closePath(); g.fill();   // spotlight on the DJ
    g.fillStyle = '#1a2020'; g.fillRect(x - 330, feet, 660, 56); g.fillStyle = '#2a3333'; g.fillRect(x - 330, feet, 660, 12); g.fillStyle = col; g.shadowColor = col; g.shadowBlur = 24 + V.pulse * 24; g.fillRect(x - 330, feet + 12, 660, 6); g.shadowBlur = 0;   // platform
    for (let k = 0; k < 11; k++) { g.fillStyle = PAL[(k + V.beatN) % 5]; g.globalAlpha = a * (0.3 + 0.5 * ((k + V.beatN) % 2) * (0.4 + V.pulse)); g.fillRect(x - 320 + k * 60, feet + 28, 44, 18); } g.globalAlpha = a;
    const Rb = (rx, ry, rw, rh, c) => { g.fillStyle = c; g.fillRect(Math.round(ox + rx * u), Math.round(oy + (ry + bob) * u), rw * u, rh * u); };
    Rb(4, 7, 8, 8, p.shirt); Rb(5, 0, 6, 7, p.skin); Rb(5, 0, 6, 2, p.hair); Rb(4, 1, 2, p.long ? 7 : 3, p.hair); Rb(9, 3, 1, 2, '#14191a'); Rb(7, 5, 3, 1, '#14191a');
    Rb(4, -1, 8, 1, '#14191a'); Rb(3, 2, 2, 4, '#14191a'); Rb(11, 2, 2, 4, '#14191a'); Rb(3, 2, 1, 4, col);   // headphones
    if (up || pump) { Rb(2, 1, 2, 8, p.shirt); Rb(2, 0, 2, 2, p.skin); Rb(12, 1, 2, 8, p.shirt); Rb(12, 0, 2, 2, p.skin); }   // both arms up in a build-up and on the drop
    else { const s = odd ? 1 : -1; Rb(2, 9, 2, 4, p.shirt); Rb(12, 9, 2, 4, p.shirt); Rb(1 + s, 12, 3, 2, p.skin); Rb(12 - s, 12, 3, 2, p.skin); }   // hands on the decks, scratching in time
    g.fillStyle = '#14191a'; g.fillRect(x - 200, feet - 70, 400, 74); g.fillStyle = '#2a3333'; g.fillRect(x - 200, feet - 70, 400, 8);
    const spin = (V.beatN + V.phase) * Math.PI / 2;   // the platters turn exactly one quarter turn per beat
    for (const dx of [-110, 110]) { g.fillStyle = '#222A2A'; g.beginPath(); g.arc(x + dx, feet - 34, 28, 0, 7); g.fill(); g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.arc(x + dx, feet - 34, 28, 0, 7); g.stroke(); const ang = spin * (dx < 0 ? 1 : -1); g.strokeStyle = '#E2DAC2'; g.beginPath(); g.moveTo(x + dx, feet - 34); g.lineTo(x + dx + Math.cos(ang) * 24, feet - 34 + Math.sin(ang) * 24); g.stroke(); }
    g.fillStyle = '#E2DAC2'; g.fillRect(x - 26, feet - 58, 52, 40); const en = clamp(V.energy.total / 50, 0, 1); for (let k = 0; k < 4; k++) { g.fillStyle = PAL[(k + V.beatN) % 5]; g.fillRect(x - 20 + k * 11, feet - 54, 6, 6 + Math.round((en * 0.5 + V.pulse * 0.5) * 26 * ((k + V.beatN) % 3 + 1) / 3)); }   // mixer lights
    txt('DJ ' + name, x, oy - 34, 44, '#F39120', '#222A2A', 8, 4);
    g.restore();
  }

  // ------------------------------------------------------------------ the light show, all tied to the beat grid
  const dim = () => (V.state === 'break' ? 0.3 : 1);
  function beams(a) {
    const pos = V.beatN + V.phase, spd = 1 + (V.state === 'build' ? V.buildP * 2.2 : 0), spread = V.state === 'build' ? 0.55 * (1 - 0.7 * V.buildP) : 0.55, bar4 = Math.floor(V.beatN / 4);

      const x = (i + 0.5) * (W / n), sw = Math.sin((pos * spd / 8) * Math.PI * 2 * (0.5 + 0.25 * (i % 3)) + i * 1.1) * spread, len = H * 1.1, wdt = 90 + V.pulse * 150 + clamp(V.energy.total / 60, 0, 1) * 60, col = PAL[(i + bar4) % PAL.length];

    }
  }
  function lasers(a) {
    const pos = V.beatN + V.phase, pattern = Math.floor(V.beatN / 16) % 4, srcs = [[0, H], [W, H], [W / 2, 0]], burst = V.sinceDrop < 2.5;
    if (V.state === 'break') { // one slow beam, like a searchlight
      g.save(); g.globalAlpha = a * 0.7; g.strokeStyle = PAL[0]; g.lineWidth = 5; g.shadowColor = PAL[0]; g.shadowBlur = 16; g.beginPath(); g.moveTo(W / 2, 0); const ang = Math.PI / 2 + Math.sin(pos / 8 * Math.PI * 2) * 0.6; g.lineTo(W / 2 + Math.cos(ang) * 2400, Math.sin(ang) * 2400); g.stroke(); g.restore(); return;

        else if (pattern === 1) ang = -Math.PI / 2 + Math.sin(ph + i * 0.7 + si) * 1.1 * open;                           // wave
        else if (pattern === 2) ang = ph / 2 + i * (Math.PI * 2 / n) + si;                                                // spin, one turn every 8 beats at normal speed
        else ang = -Math.PI / 2 + (si === 0 ? 1 : si === 1 ? -1 : 0) * (f * 1.4 * open) + Math.sin(ph) * 0.2;           // cross

  function mirrorBall(a) {

    const pos = V.beatN + V.phase; for (let k = 0; k < 14; k++) { const ax = pos / 4 * Math.PI + k * 0.9, sx = x + Math.cos(ax) * (r - 4) * Math.abs(Math.sin(k * 1.3)), sy = y + Math.sin(ax * 1.3) * (r - 4) * 0.7; g.fillStyle = PAL[(k + V.beatN) % 5]; g.globalAlpha = a * (0.5 + V.pulse * 0.5); g.fillRect(sx - 3, sy - 3, 6, 6); }
    g.restore();

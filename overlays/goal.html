<!doctype html>
<html><head><meta charset="utf-8"><title>IMC-Stream Goal</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Add as an OBS Browser Source:  http://localhost:8420/overlays/goal.html?id=<goal id>   (suggested size 1000 x 140)  */
  :root { --fill: linear-gradient(90deg, var(--aqua) 0 30%, var(--heat) 30% 55%, var(--rust) 55% 75%, var(--drust) 75% 90%, var(--cream) 90%); --accent: var(--aqua); }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 14px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); opacity: 0; transition: opacity .4s; }
  .wrap.ready { opacity: 1; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-bottom: 8px; padding: 0 22px; text-transform: uppercase; font-weight: 700; }
  .title { font-size: 34px; letter-spacing: 5px; font-stretch: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { font-size: 34px; letter-spacing: 2px; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 56px; background: var(--iron-d); overflow: hidden; clip-path: polygon(26px 0, 100% 0, calc(100% - 26px) 100%, 0 100%); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; overflow: hidden; transition: width 1.4s cubic-bezier(.2,.8,.2,1); }
  .fill::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--full, 1000px); background: var(--fillbg, var(--fill)); }
  .fill::after { content: ""; position: absolute; top: 0; bottom: 0; width: 120px; left: -160px; background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent); transform: skewX(-20deg); animation: shine 3.2s 1s infinite; }
  @keyframes shine { 0% { left: -160px; } 60%, 100% { left: 110%; } }
  .tick { position: absolute; top: 0; bottom: 0; width: 3px; background: rgba(0,0,0,.35); }
  .pct { position: absolute; right: 38px; top: 0; bottom: 0; display: flex; align-items: center; font-size: 30px; font-weight: 700; letter-spacing: 2px; color: var(--cream); text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .done .title { color: var(--heat); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .slim .track { height: 22px; clip-path: polygon(11px 0, 100% 0, calc(100% - 11px) 100%, 0 100%); }
  .slim .head { margin-bottom: 6px; } .slim .title, .slim .count { font-size: 28px; } .slim .pct { display: none; }
  .accent-aqua { --fillbg: var(--aqua); --accent: var(--aqua); } .accent-heat { --fillbg: var(--heat); --accent: var(--heat); }
  .accent-rust { --fillbg: var(--rust); --accent: var(--rust); } .accent-cream { --fillbg: var(--cream); --accent: var(--cream); }
  .accent-rainbow { --accent: var(--heat); }
</style></head>
<body>
<div class="wrap" id="wrap">
  <div class="head"><span class="title" id="title"></span><span class="count" id="count"></span></div>
  <div class="track" id="track">
    <div class="fill" id="fill"></div>
    <div class="tick" style="left:25%"></div><div class="tick" style="left:50%"></div><div class="tick" style="left:75%"></div>
    <div class="pct" id="pct"></div>
  </div>
</div>
<script src="config.js"></script>
<script>
(function () {
  const C = window.CFG || {}, Q = new URLSearchParams(location.search);
  const BASE = icmBase('goal', +(Q.get('port') || C.serverPort || 8420));
  const want = Q.get('id');
  const $ = (id) => document.getElementById(id);
  const nf = new Intl.NumberFormat('en-US');
  let current = null;
  const fmt = (g, n) => (g.money ? '$' + n.toFixed(2) : nf.format(n));
  function draw(list) {
    const g = (want ? list.find((x) => x.id === want) : list[0]) || null;
    if (!g) { $('wrap').classList.remove('ready'); return; }
    current = g;
    const w = $('wrap');
    w.className = 'wrap ready' + (g.done ? ' done' : '') + (g.style === 'slim' ? ' slim' : '') + ' accent-' + g.color;
    $('title').textContent = g.done ? 'Goal reached! ' + g.title : g.title;
    $('count').textContent = fmt(g, g.value) + ' / ' + fmt(g, g.target);
    $('pct').textContent = Math.floor(g.percent) + '%';
    document.documentElement.style.setProperty('--full', $('track').clientWidth + 'px');
    $('fill').style.width = g.percent + '%';
  }
  window.addEventListener('resize', () => current && document.documentElement.style.setProperty('--full', $('track').clientWidth + 'px'));
  if (Q.get('demo')) { draw([{ id: 'd', title: 'Road to 500', value: 342, target: 500, percent: 68.4, color: Q.get('color') || 'rainbow', style: Q.get('style') || 'bar', done: false }]); return; }
  fetch(BASE + '/api/goals').then((r) => r.json()).then((j) => draw(j.goals)).catch(() => {});
  const es = new EventSource(BASE + '/events');
  es.addEventListener('goals', (e) => draw(JSON.parse(e.data)));
})();
</script>
</body></html>

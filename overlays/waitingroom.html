    if (cur) lines.push(cur); if (!lines.length) lines.push('...'); if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].slice(0, 13) + '..'; } return lines;
  }
  function update(now, dt) {
    for (const p of [...people.values()]) {
      const tgt = p.mode === 'leave' ? { x: DOOR.x + 4, y: DOOR.y + 14 } : p.seat ? { x: p.seat.x, y: p.seat.y } : null; if (!tgt) continue;
      const dx = tgt.x - p.x, dy = tgt.y - p.y, d = Math.hypot(dx, dy), v = 38 * SPEED * dt / 1000;
      if (d > 0.8) { p.x += dx / d * Math.min(v, d); p.y += dy / d * Math.min(v, d); if (Math.abs(dx) > 0.5) p.dir = dx > 0 ? 1 : -1; }
      else if (p.mode === 'walk') { p.mode = p.seat.kind === 'sit' ? 'sit' : 'stand'; p.dir = p.seat.x < 240 ? 1 : -1; }
      else if (p.mode === 'leave') people.delete(p.login);
      if (p.mode !== 'leave' && Date.now() - p.last > IDLE) leave(p);
    }
  }
  let lastT = performance.now();
  function draw(now) {
    requestAnimationFrame(draw); const dt = Math.min(100, now - lastT); lastT = now; update(now, dt);
    g.clearRect(0, 0, W, H); g.drawImage(room, 0, 0);
    const tv = Math.floor(now / 700) % 3; R(312, 8, 34, 20, '#26383d'); R(314, 10, 30, 16, ['#1f3f48', '#2a4a30', '#3a2a48'][tv]); R(314 + tv * 8, 10, 8, 16, ['#2e86c1', '#6aa84f', '#8e7cc3'][tv]); R(320 + ((now / 400) | 0) % 18, 16, 4, 4, '#ffffff66');   // the TV picture
    const list = [...people.values()].sort((a, b) => a.y - b.y);
    list.filter((p) => p.mode === 'sit').forEach((p) => person(p, now));
    g.drawImage(front, 0, 0);
    list.filter((p) => p.mode !== 'sit').forEach((p) => person(p, now));
    list.forEach((p) => { if (now < (p.tagUntil || 0)) nameTag(p); }); list.forEach((p) => bubble(p, now));
  }
  g.imageSmoothingEnabled = false; requestAnimationFrame(draw);

  window.waitingRoomChat = chat; window.waitingRoom = { people, SEATS, SPOTS };   // (handy for debugging)
  try { const es = new EventSource(BASE + '/events'); es.addEventListener('chat', (e) => { try { chat(JSON.parse(e.data)); } catch (x) { /* ignore */ } }); } catch (x) { /* no server: the room stays empty */ }
  if (Q.get('demo')) {
    const folks = [['RetroRider', 'hey everyone, long time no see!'], ['BitBaron', 'first time here'], ['TealTina', 'what are we playing today'], ['ChaosChad', 'LUL'], ['GenerousGamer', 'brought snacks for everybody'], ['PixelPat', 'is the stream starting soon?'], ['VinylVince', 'this room is so cozy'], ['MaxMuscle', 'gg']];
    folks.forEach(([n, t], i) => setTimeout(() => chat({ login: n.toLowerCase(), name: n, text: t }), 400 + i * 700));
    setInterval(() => { const f = folks[Math.floor(Math.random() * folks.length)]; chat({ login: f[0].toLowerCase(), name: f[0], text: f[1] }); }, 4500);
  }
})();

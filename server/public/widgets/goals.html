<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="w.css"><script src="/ui-theme.js"></script>
<style>
  .g { margin-bottom: 12px; } .g .t { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; } .g .t span { color: #9aa39f; font-weight: 400; letter-spacing: 0; white-space: nowrap; }
  .bar { height: 16px; background: var(--iron); position: relative; clip-path: polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%); margin-top: 4px; } .bar i { position: absolute; left: 0; top: 0; bottom: 0; overflow: hidden; transition: width .8s; } .bar i::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--full, 300px); background: var(--c); }
  .bar.rb i::before { background: linear-gradient(90deg,#4FBBBC 0 30%,#F39120 30% 55%,#EC4624 55% 75%,#B13A22 75% 90%,#E2DAC2 90%); }
  .adj { display: flex; gap: 4px; margin-top: 4px; } .adj button { padding: 3px 8px; }
</style></head><body>
<div id="l" class="muted">No goals yet. Create them on the Goals page.</div>
<script src="w.js"></script><script>
const COLORS = { aqua: '#4FBBBC', heat: '#F39120', rust: '#EC4624', cream: '#E2DAC2', rainbow: '#4FBBBC' };
const fmt = (g, n) => (g.money ? '$' + Number(n).toFixed(2) : Number(n).toLocaleString());
function draw(goals) {
  if (!goals.length) { $('l').className = 'muted'; $('l').textContent = 'No goals yet. Create them on the Goals page.'; return; }
  $('l').className = '';
  $('l').innerHTML = goals.map((g) => '<div class="g" data-id="' + esc(g.id) + '"><div class="t"><div>' + esc(g.title) + (g.done ? ' &#10004;' : '') + '</div><span>' + fmt(g, g.value) + ' / ' + fmt(g, g.target) + '</span></div><div class="bar ' + (g.color === 'rainbow' ? 'rb' : '') + '" style="--c:' + (COLORS[g.color] || '#4FBBBC') + '"><i style="width:' + g.percent + '%"></i></div>'
    + (g.metric === 'manual' ? '<div class="adj"><button class="c" data-d="-1">-1</button><button data-d="1">+1</button><button class="o" data-d="10">+10</button></div>' : '') + '</div>').join('');
  document.querySelectorAll('.bar').forEach((b) => b.style.setProperty('--full', b.clientWidth + 'px'));
}
$('l').onclick = (e) => { const b = e.target.closest('[data-d]'); if (b) post('/api/goals/adjust', { id: b.closest('.g').dataset.id, delta: +b.dataset.d }); };
get('/api/goals').then((j) => draw(j.goals)); live({ goals: draw });
</script></body></html>

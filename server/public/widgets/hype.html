<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="w.css"><script src="/ui-theme.js"></script></head><body>
<div class="lbl">Hype train</div><div class="big" id="lv">Idle</div><div style="background:#11171a;height:14px;margin:8px 0"><div id="b" style="height:100%;width:0;background:var(--heat);transition:width .6s"></div></div><div class="muted" id="m"></div>
<script src="w.js"></script><script>
function draw(h) { $('lv').textContent = h.active ? 'Level ' + h.level : 'Idle'; $('b').style.width = h.active && h.goal ? Math.min(100, h.progress / h.goal * 100) + '%' : '0'; $('m').textContent = h.active ? (h.progress + ' / ' + h.goal + (h.top ? ' - top: ' + h.top : '')) : (h.lastLevel ? 'Last train reached level ' + h.lastLevel : 'No train running'); }
get('/api/hype').then(draw); live({ hype: draw });
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="w.css"><script src="/ui-theme.js"></script></head><body>
<div class="lbl" id="l">Subathon</div><div class="big" id="t">-</div>
<div class="row" style="margin-top:8px"><button data-a="pause" class="g">Pause</button><button data-a="resume">Resume</button><button data-a="add" data-s="300" class="o">+5 min</button><button data-a="add" data-s="-300" class="g">-5 min</button></div>
<script src="w.js"></script><script>
let C = null;
function draw() { if (!C) return; const ms = C.mode === 'running' ? Math.max(0, C.endsAt - Date.now()) : C.remainingMs; const s = Math.max(0, Math.round(ms / 1000)); $('t').textContent = Math.floor(s / 3600) + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); $('l').textContent = (C.label || 'Subathon') + ' - ' + C.mode; }
get('/api/subathon').then((c) => { C = c; draw(); }); live({ subathon: (c) => { C = c; draw(); } }); setInterval(draw, 500);
document.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => act(b, () => post('/api/subathon/' + b.dataset.a, b.dataset.s ? { seconds: +b.dataset.s } : {}))));
</script></body></html>

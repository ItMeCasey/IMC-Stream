<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>IMC Audio Router</title>
<style>
  :root { --iron:#222A2A; --iron-d:#1A2020; --aqua:#4FBBBC; --heat:#F39120; --rust:#EC4624; --cream:#E2DAC2; --line:#46504f; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 330px; background: var(--iron); color: var(--cream); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { background: var(--iron-d); padding: 10px 14px; letter-spacing: 4px; font-weight: 700; font-size: 13px; border-bottom: 4px solid var(--heat); }
  main { padding: 12px 14px 14px; display: grid; gap: 10px; }
  label { display: grid; gap: 4px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #b5bdb9; }
  select, input { font: inherit; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--cream); background: var(--iron-d); border: 2px solid var(--line); padding: 7px 8px; width: 100%; }
  select:focus, input:focus { outline: none; border-color: var(--heat); }
  button { font: inherit; font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; padding: 9px 12px; border: 0; cursor: pointer; background: var(--heat); color: var(--iron-d); }
  button:hover { filter: brightness(1.12); } button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--cream); outline: 2px solid var(--line); outline-offset: -2px; }
  .row { display: flex; gap: 8px; } .row button { flex: 1; }
  #state { padding: 8px 10px; background: var(--iron-d); border-left: 4px solid var(--line); font-size: 13px; } #state.on { border-color: var(--heat); }
  #msg { min-height: 18px; font-size: 12px; color: var(--rust); } #msg.ok { color: var(--aqua); }
  small { color: #9aa39f; font-size: 11.5px; } a { color: var(--aqua); cursor: pointer; }
</style></head>
<body>
<header>AUDIO ROUTER</header>
<main>
  <div id="state">Checking this tab...</div>
  <label>Play this tab's sound on<select id="dev"></select></label>
  <div class="row"><button id="go">Send sound here</button><button id="stop" class="ghost">Back to normal</button></div>
  <div id="msg"></div>
  <small id="names" hidden>The devices have no names yet. <a id="grant">Show device names</a> (asks once, nothing is recorded).</small>
  <label>Preselect a device whose name contains<input id="prefer" placeholder="Aux" spellcheck="false"></label>
  <small>While a tab is sent here it stops playing on your normal output. "Back to normal" gives it back.</small>
</main>
<script src="match.js"></script><script src="popup.js"></script>
</body></html>

<h1>DEVICE NAMES</h1>
<p>Browsers hide the names of your speakers and headphones (so you see "Audio output 1, 2, 3...") until you allow microphone access once. The extension never records anything: it only reads the device names, then lets go of the microphone straight away.</p>
<p><button id="go">Show device names</button></p>
<div id="out"></div>
